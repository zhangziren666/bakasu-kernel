name: Build SukiSU-Nova Kernel (OPPO A32/A53 · sm4250 · non-GKI 4.19)

# 说明：
#   云端编译 OPPO sm4250 (Bengal) Android 12 内核源码 + SukiSU-Nova（KernelSU 衍生版），
#   产出 Image.gz。内核源码与配置基线均为官方 OPPO 源：分支 oppo/sm4250_s_12.1
#   本仓库只做「拉源码 → 打 SUSFS 2.4.0 补丁 → 装 KSU 内联 hook → 集成 SukiSU-Nova(builtin-new)
#   → 追加配置 → 编译 → 上传 artifact」。
#
#   为什么用 Nova 的 builtin-new 分支：
#     * main / v3.0.0：使用 5.9+ 才有的 SELinux 内部结构（struct selinux_policy 等）
#       与 5.8+ 的 copy_from_user_nofault，4.19 上无法编译。
#     * builtin：只实现了 SUSFS 2.3 时代的命令，不会调用 SUSFS 2.4 新增的
#       sus_type / sus_avd / sus_path_uid_filter / priority_uid_filter 接口。
#     * builtin-new：专为 4.19 维护，rules.c 带 <5.10 的 selinux_state.ss->policydb 分支，
#       supercall/sepolicy 完整支持 SUSFS v2.4 命令；KPM 只是被 kernel_compat.h 里的
#       版本门槛挡在 5.10+（KPM 源码本身在 4.19 可用，本流程把这个门槛下调到 4.4）。
#
#   SUSFS 2.4.0 的 4.19 移植来自 JackA1ltman/NonGKI_Kernel_Build_2nd
#   （patches/50_add_susfs_in_kernel-4.19-2.4.0.patch，仅补了 2 处与本机源码的上下文差异），
#   内联 hook（fs/exec.c、fs/open.c、fs/stat.c、kernel/reboot.c …）用同仓库的
#   susfs_inline_hook_patches.sh 安装。

on:
  workflow_dispatch:
    inputs:
      ksu_ref:
        description: "SukiSU-Nova 分支（4.19 + SUSFS2.4.0 + KPM 必须用 builtin-new）"
        required: true
        default: "builtin-new"
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 300

    env:
      KSRC: kernel/msm-4.19                      # 内核源码工作目录
      OUT: ${{ github.workspace }}/out           # 编译输出目录
      KSU_REF: ${{ inputs.ksu_ref || 'builtin-new' }}
      KSU_REPO: https://github.com/SukiSU-Nova/SukiSU-Nova.git
      KBRANCH: oppo/sm4250_s_12.1              # 出厂 C12 内核对应的源码分支（_f19 分支缺少部分出厂驱动）
      CLANG_DIR: ${{ github.workspace }}/tc/clang
      GCC64_DIR: ${{ github.workspace }}/tc/gcc64
      GCC32_DIR: ${{ github.workspace }}/tc/gcc32

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev zip unzip python3 cpio rsync patch

      - name: Cache toolchains
        id: tc-cache
        uses: actions/cache@v4
        with:
          path: tc
          key: tc-r383902-gcc49-v1

      - name: Fetch toolchains (clang r383902 = clang 10.0.7 + GNU binutils 4.9)
        if: steps.tc-cache.outputs.cache-hit != 'true'
        run: |
          set -e
          try_clone() {
            local dir="$1" url="$2" br="${3:-}"
            rm -rf "$dir"
            if [ -n "$br" ]; then
              git clone --depth=1 -b "$br" "$url" "$dir"
            else
              git clone --depth=1 "$url" "$dir"
            fi
          }
          # clang 10.0.7 (r383902) —— 与原厂 boot.img 内核编译版本一致，兼容性最好
          try_clone tc/clang https://github.com/AOSP-10/prebuilts_clang_host_linux-x86_clang-r383902.git 10 \
            || try_clone tc/clang https://github.com/afaneh-toolchain/prebuilts_clang_host_linux-x86_clang-r383902.git \
            || try_clone tc/clang https://github.com/DevZillion/clang_r383902.git \
            || { echo "::error::无法获取 clang r383902 工具链"; exit 1; }
          # GNU binutils / gcc 4.9 (arm64 与 arm32)
          try_clone tc/gcc64 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git lineage-19.1 \
            || { echo "::error::无法获取 aarch64 gcc 4.9 工具链"; exit 1; }
          try_clone tc/gcc32 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git lineage-19.1 \
            || { echo "::error::无法获取 arm gcc 4.9 工具链"; exit 1; }
          echo "--- clang ---"; tc/clang/bin/clang --version | head -n 3

      - name: Clone OPPO kernel sources
        run: |
          set -e
          git clone --depth=1 -b "$KBRANCH" \
            https://github.com/oppo-source/android_kernel_oppo_sm4250.git "$KSRC"
          # 配套的 vendor 模块与设备树仓库 —— 按 Android 源码树的相对布局叠加
          git clone --depth=1 -b "$KBRANCH" \
            https://github.com/oppo-source/android_kernel_modules_and_devicetree_oppo_sm4250.git /tmp/oplus-extra
          cp -a /tmp/oplus-extra/kernel/msm-4.19/. "$KSRC"/
          mkdir -p vendor
          cp -a /tmp/oplus-extra/vendor/. vendor/
          rm -rf /tmp/oplus-extra
          echo "--- kernel version ---"
          head -n 5 "$KSRC/Makefile"
          git -C "$KSRC" log -1 --format='%H %ci %s' || true

      - name: Apply SUSFS v2.4.0 kernel patch (4.19 port)
        run: |
          set -e
          cd "$KSRC"
          PATCH="$GITHUB_WORKSPACE/patches/50_add_susfs_in_kernel-4.19-2.4.0.patch"
          test -f "$PATCH" || { echo "::error::缺少 SUSFS 2.4.0 补丁: $PATCH"; exit 1; }
          # --fuzz=3：OPPO 出厂源码与上游 4.19 有少量上下文差异（已按本机源码校正过 2 处）
          patch -p1 --fuzz=3 --forward < "$PATCH" | tee /tmp/susfs_patch.log || true
          REJ=$(find . -name '*.rej' | sort)
          if [ -n "$REJ" ]; then
            echo "::error::SUSFS 2.4.0 补丁存在无法应用的 hunk"
            for r in $REJ; do echo "=== $r ==="; sed -n '1,60p' "$r"; done
            exit 1
          fi
          echo "--- SUSFS patch applied ---"
          test -f fs/susfs.c             || { echo "::error::未生成 fs/susfs.c"; exit 1; }
          test -f include/linux/susfs.h  || { echo "::error::未生成 include/linux/susfs.h"; exit 1; }
          grep -E '^#define SUSFS_VERSION' include/linux/susfs.h
          grep -q '#define SUSFS_VERSION "v2.4.0"' include/linux/susfs.h \
            || { echo "::error::SUSFS 版本不是 v2.4.0"; exit 1; }
          for sym in susfs_add_sus_type susfs_add_sus_avd_allowed_by_type \
                     susfs_set_sus_path_uid_filter susfs_set_priority_uid_filter \
                     susfs_parse_sus_path_app_strings susfs_set_avc_log_spoofing; do
            grep -q "$sym" fs/susfs.c || { echo "::error::SUSFS 2.4 接口缺失: $sym"; exit 1; }
          done
          grep -q 'CMD_SUSFS_SET_SUS_PATH_UID_FILTER' include/linux/susfs_def.h \
            || { echo "::error::缺少 CMD_SUSFS_SET_SUS_PATH_UID_FILTER"; exit 1; }
          grep -n 'susfs' fs/Makefile

      - name: Install SUSFS / KSU inline hooks
        run: |
          set -e
          cd "$KSRC"
          bash "$GITHUB_WORKSPACE/patches/susfs_inline_hook_patches.sh" | tee /tmp/hook.log
          echo "--- hook log 摘要 ---"
          grep -E '\[\+\]|\[-\]' /tmp/hook.log | head -n 80 || true

          # 4.19 走 CONFIG_KSU_LSM_SECURITY_HOOKS（lsm_hooks_list.c），
          # ksu_hide_setprocattr 由该文件里的 inline 版本完成；
          # manual 版本（lsm_hooks_manual.c）不参与编译，所以这里必须去掉
          # selinux/hooks.c 里对 ksu_hide_setprocattr 的调用，否则链接期 undefined。
          sed -i '/ksu_hide_setprocattr/d' security/selinux/hooks.c

          # open.c / stat.c 在 patch 时 namei.c 还是 static，脚本可能漏掉 filename_lookup 的声明；
          # 这里补一个显式 extern，避免隐式声明（-Werror 环境下会直接失败）。
          python3 - <<'PY'
          import io
          decl = ('extern int filename_lookup(int dfd, struct filename *name, unsigned flags,\n'
                  '\t\t\t   struct path *path, struct path *root);\n')
          for p in ('fs/open.c', 'fs/stat.c'):
              s = open(p, encoding='utf-8').read()
              if 'filename_lookup(' not in s:
                  continue
              if 'extern int filename_lookup' in s:
                  continue
              marker = '#include <linux/susfs_def.h>\n'
              idx = s.find(marker)
              assert idx != -1, p
              idx += len(marker)
              # 跳过可能紧跟的 #endif 行
              tail = s[idx:]
              lines = tail.split('\n')
              off = 0
              if lines and lines[0].startswith('#endif'):
                  off = len(lines[0]) + 1
              s = s[:idx + off] + decl + s[idx + off:]
              open(p, 'w', encoding='utf-8').write(s)
              print('added extern filename_lookup to', p)
          PY

          # OPPO 4.19 的 inotify_fdinfo 在 `if (inode) {` 后紧跟一个局部变量声明
          # （u32 mask = mark->mask & IN_ALL_EVENTS;），而 SUSFS 补丁把 orig_flow:
          # 标签插到了它前面。C 语言不允许「标签后面直接跟声明」，Clang 会报
          # expected expression / use of undeclared identifier 'mask'。
          # 在标签后补一个空语句即可，语义不变（标签仍在声明之前，goto 过来后
          # mask 仍会被正常初始化）。
          python3 - <<'PY'
          p = 'fs/notify/fdinfo.c'
          s = open(p, encoding='utf-8').read()
          old = 'orig_flow:\n#endif // #ifdef CONFIG_KSU_SUSFS_SUS_MOUNT'
          new = 'orig_flow:\n\t\t\t\t;\n#endif // #ifdef CONFIG_KSU_SUSFS_SUS_MOUNT'
          if 'orig_flow:\n\t\t\t\t;' in s:
              print('orig_flow 空语句已存在，跳过')
          elif old in s:
              s = s.replace(old, new, 1)
              open(p, 'w', encoding='utf-8').write(s)
              print('已在 fs/notify/fdinfo.c 的 orig_flow 标签后补空语句')
          else:
              print('警告：未找到 orig_flow 标签模式')
          PY

          echo "--- 校验 hook 是否全部落地 ---"
          for sym in ksu_handle_execveat ksu_handle_execveat_sucompat ksu_handle_post_execveat_sucompat \
                     ksu_handle_faccessat ksu_handle_stat ksu_handle_vfs_fstat ksu_handle_setresuid \
                     ksu_handle_input_handle_event ksu_handle_sys_read ksu_handle_sys_reboot; do
            c=$(grep -R --include='*.c' -h "$sym" fs kernel drivers security 2>/dev/null | wc -l)
            echo "$sym -> $c"
            [ "$c" -gt 0 ] || { echo "::error::inline hook $sym 未安装"; exit 1; }
          done
          grep -q 'ksu_hide_setprocattr' security/selinux/hooks.c \
            && { echo "::error::ksu_hide_setprocattr 仍残留在 hooks.c"; exit 1; } || true
          echo "--- selinux hooks.c: setprocattr / bprm ---"
          grep -n 'ksu_sid\|secdata\|check_nnp_nosuid\|selinux_setprocattr' security/selinux/hooks.c | head -n 20 || true

      - name: Integrate SukiSU-Nova kernel driver (builtin-new)
        run: |
          set -e
          # 完整历史克隆（blob 按需拉取；Makefile 里会用 git/curl 计算版本号）
          rm -rf "$KSRC/SukiSU-Nova"
          git clone --filter=blob:none "$KSU_REPO" "$KSRC/SukiSU-Nova"
          git -C "$KSRC/SukiSU-Nova" checkout "$KSU_REF"
          echo "--- checked out ---"
          git -C "$KSRC/SukiSU-Nova" log -1 --oneline

          cd "$KSRC"
          echo "$KSU_REF" | grep -qx 'builtin-new' \
            || { echo "::error::本流程只支持 builtin-new（当前 $KSU_REF）"; exit 1; }

          # builtin-new 的 kernel/ 目录只带 Makefile（没有 Kbuild）。
          # kbuild 在目录内没有 Kbuild 时会自动回退读取 Makefile，所以这里必须保留 Makefile。
          rm -rf drivers/kernelsu
          mkdir -p drivers/kernelsu
          cp -a SukiSU-Nova/kernel/. drivers/kernelsu/
          for f in Makefile Kconfig kernel_compat.h ksu.c kernel_includes.h \
                   hook/lsm_hooks_list.c extension/kpm/kpm.c extension/kpm/compact.c \
                   manager/apk_sign.c; do
            test -f "drivers/kernelsu/$f" || { echo "::error::drivers/kernelsu/$f 缺失（不是 builtin-new 分支？）"; exit 1; }
          done
          grep -q '^obj-\$(CONFIG_KSU) := kernelsu.o' drivers/kernelsu/Makefile \
            || { echo "::error::Makefile 不是 builtin-new 版本"; exit 1; }
          grep -q 'config KSU_SUSFS' drivers/kernelsu/Kconfig \
            || { echo "::error::Kconfig 缺少 KSU_SUSFS"; exit 1; }
          # Nova 官方管理器签名哈希定义在 kernel/Makefile 的 KSU_EXPECTED_HASH（-D 传给 apk_sign.c）
          grep -q '947ae944f3de4ed4c21a7e4f7953ecf351bfa2b36239da37a34111ad29993eef' drivers/kernelsu/Makefile \
            || { echo "::error::Makefile 未内置 Nova 管理器签名哈希"; exit 1; }
          grep -q 'EXPECTED_HASH' drivers/kernelsu/manager/apk_sign.c \
            || { echo "::error::apk_sign.c 未引用 EXPECTED_HASH"; exit 1; }

          # KPM 源码本身兼容 4.19（access_ok/thread_pid 都按版本处理），
          # 只是 kernel_compat.h 把可用门槛写死成 5.10+，这里下调到 4.4。
          python3 - <<'PY'
          p = 'drivers/kernelsu/kernel_compat.h'
          s = open(p, encoding='utf-8').read()
          old = '#if LINUX_VERSION_CODE >= KERNEL_VERSION(5, 10, 0)\n#define KSU_CAN_USE_KPM'
          new = '#if LINUX_VERSION_CODE >= KERNEL_VERSION(4, 4, 0)\n#define KSU_CAN_USE_KPM'
          assert old in s, 'KSU_CAN_USE_KPM gate not found'
          open(p, 'w', encoding='utf-8').write(s.replace(old, new, 1))
          print('KSU_CAN_USE_KPM gate -> 4.4')
          PY
          grep -n -A1 'KSU_CAN_USE_KPM' drivers/kernelsu/kernel_compat.h | head -n 6

          # drivers/Makefile
          grep -q 'kernelsu/' drivers/Makefile \
            || printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> drivers/Makefile

          # drivers/Kconfig：插到最后一个 endmenu 之前（保持在 "Device Drivers" 菜单内）
          grep -q 'drivers/kernelsu/Kconfig' drivers/Kconfig \
            || python3 - <<'PY'
          p = 'drivers/Kconfig'
          s = open(p, encoding='utf-8').read()
          idx = s.rfind('endmenu')
          assert idx != -1, 'drivers/Kconfig 里找不到 endmenu'
          s = s[:idx] + 'source "drivers/kernelsu/Kconfig"\n\n' + s[idx:]
          open(p, 'w', encoding='utf-8').write(s)
          PY

          echo "--- integration check ---"
          ls drivers/kernelsu | head -n 20
          tail -n 2 drivers/Makefile
          grep -n 'kernelsu' drivers/Kconfig

      - name: Add 4.19 header shims (compat safety net)
        run: |
          set -e
          cd "$KSRC"
          # 4.19 没有 5.x 才引入的这几个头，新版驱动里可能无条件 include；
          # 缺失时补一个转发 shim，已存在则跳过（纯增量，不改动原厂头文件）
          make_shim() {   # $1=头文件名 $2=转发目标 $3=include guard
            local name="$1" target="$2" guard="$3"
            if [ -f "include/linux/$name" ]; then
              echo "include/linux/$name 已存在，跳过"
              return 0
            fi
            {
              echo "/* 4.19 compat shim (CI 自动生成) */"
              echo "#ifndef $guard"
              echo "#define $guard"
              echo "#include $target"
              echo "#endif"
            } > "include/linux/$name"
            echo "已生成 include/linux/$name -> $target"
          }
          # KPM (extension/kpm) 会无条件 include <linux/set_memory.h>（5.0 才有），
          # 但实际并未调用 set_memory_*，所以补一个空头即可（arm64 4.19 没有 asm/set_memory.h）
          if [ ! -f include/linux/set_memory.h ]; then
            printf '/* 4.19 compat shim (CI 自动生成) */\n#ifndef _LINUX_SET_MEMORY_COMPAT_H\n#define _LINUX_SET_MEMORY_COMPAT_H\n#endif\n' \
              > include/linux/set_memory.h
            echo "已生成 include/linux/set_memory.h（空头，4.19 未使用 set_memory_*）"
          fi
          make_shim pgtable.h     '<asm/pgtable.h>'     _LINUX_PGTABLE_COMPAT_H
          make_shim minmax.h      '<linux/kernel.h>'    _LINUX_MINMAX_COMPAT_H
          make_shim hex.h         '<linux/kernel.h>'    _LINUX_HEX_COMPAT_H
          make_shim unaligned.h   '<asm/unaligned.h>'   _LINUX_UNALIGNED_COMPAT_H

      # ------------------------------------------------------------------
      # 关键：以「原厂 .config」为唯一基线
      #   原因：CONFIG_MODVERSIONS=y 时，内核每个导出符号的 CRC 由「源码 + 配置」
      #   共同决定。用 bengal-perf_defconfig + 大量关闭调试/OPPO 特性，会改变
      #   struct 布局（如 CONFIG_SCHEDSTATS 影响 struct task_struct），导致
      #   __kcrctab 与原厂大面积不符 → vendor 的 qca_cld3_wlan.ko 因
      #   "disagrees about version of symbol" 拒载 → WiFi 打不开。
      #   现在只在这份原厂配置上追加 KSU 必需项，其余一律不动。
      # ------------------------------------------------------------------
      - name: Install factory (stock) kernel config
        run: |
          set -e
          mkdir -p "$OUT"
          CFG="$GITHUB_WORKSPACE/configs/stock_bengal-perf.config"
          test -f "$CFG" || { echo "::error::缺少 configs/stock_bengal-perf.config（原厂 .config）"; exit 1; }
          cp "$CFG" "$OUT/.config"
          cp "$CFG" "$OUT/.config.baseline"
          echo "原厂配置行数: $(wc -l < "$OUT/.config")"
          grep -E '^CONFIG_(LOCALVERSION|MODVERSIONS|MODULE_SIG_FORCE|THREAD_INFO_IN_TASK|WLAN|CFG80211|ICNSS|CNSS_GENL|CRYPTO_SHA256|OVERLAY_FS)=' "$OUT/.config" || true

      - name: Append SukiSU-Nova (builtin-new + SUSFS 2.4.0 + KPM) config
        env:
          FRAGMENT: |
            # ==================================================================
            # 仅追加 SukiSU-Nova (builtin-new) + SUSFS 2.4.0 + KPM 必需项；
            # 其余全部沿用原厂 .config
            # ==================================================================
            CONFIG_KSU=y
            CONFIG_KSU_FEATURE_ADBROOT=y
            CONFIG_KSU_DEBUG=n
            CONFIG_KSU_LSM_SECURITY_HOOKS=y
            # SUSFS 模式下不能同时启用 branch link / syscall table 两套 hook
            # CONFIG_KSU_HACK_ARM64_BRANCH_LINK is not set
            # CONFIG_KSU_TAMPER_SYSCALL_TABLE is not set

            # ---- SUSFS 2.4.0（由上面打的内核补丁 + inline hook 提供实现）----
            CONFIG_KSU_SUSFS=y
            CONFIG_KSU_SUSFS_INLINE_HOOK=y
            CONFIG_KSU_SUSFS_SUS_PATH=y
            CONFIG_KSU_SUSFS_SUS_MOUNT=y
            CONFIG_KSU_SUSFS_SUS_KSTAT=y
            CONFIG_KSU_SUSFS_SPOOF_UNAME=y
            CONFIG_KSU_SUSFS_ENABLE_LOG=y
            CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
            CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
            CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
            CONFIG_KSU_SUSFS_SUS_MAP=y
            CONFIG_KSU_SUSFS_PRIORITY_UID_FILTER=y

            # ---- KPM（门槛已下调到 Linux >= 4.4）----
            CONFIG_KPM=y

            # KSU/KPM 依赖（原厂已开，显式保留）
            CONFIG_THREAD_INFO_IN_TASK=y
            CONFIG_KALLSYMS=y
            CONFIG_KALLSYMS_ALL=y

            # 原厂是强制签名(MODULE_SIG_FORCE=y)：自编内核没有 OPPO 私钥，
            # 必须关掉强制校验，否则 vendor 分区所有 .ko 都会被拒载。
            # 只关 FORCE，MODVERSIONS 与 vermagic 保持原样。
            # CONFIG_MODULE_SIG_FORCE is not set

            # 仅减少编译时间/体积，不影响结构体布局与符号 CRC
            # CONFIG_DEBUG_INFO is not set
        run: |
          set -e
          printf '\n%s\n' "$FRAGMENT" >> "$OUT/.config"
          echo "--- appended tail ---"
          tail -n 34 "$OUT/.config"

      - name: Configure kernel
        run: |
          set -e
          export PATH="$CLANG_DIR/bin:$GCC64_DIR/bin:$GCC32_DIR/bin:$PATH"
          MAKE_ARGS=(
            -C "$KSRC" O="$OUT" ARCH=arm64
            CC=clang CLANG_TRIPLE=aarch64-linux-gnu- REAL_CC="$CLANG_DIR/bin/clang"
            CROSS_COMPILE=aarch64-linux-android-
            CROSS_COMPILE_ARM32=arm-linux-androideabi-
          )
          make "${MAKE_ARGS[@]}" olddefconfig
          echo "--- 与原厂配置的差异（正常应只剩 KSU/SUSFS/KPM + MODULE_SIG_FORCE + DEBUG_INFO）---"
          diff -u "$OUT/.config.baseline" "$OUT/.config" > "$OUT/config_diff.txt" || true
          echo "差异行数: $(wc -l < "$OUT/config_diff.txt")"
          grep -E '^[+-]CONFIG_' "$OUT/config_diff.txt" | head -n 120 || true
          echo "--- key configs ---"
          grep -E '^CONFIG_(KSU|KSU_SUSFS|KSU_SUSFS_[A-Z_]+|KSU_LSM_SECURITY_HOOKS|KSU_FEATURE_ADBROOT|KPM|KALLSYMS|KALLSYMS_ALL|THREAD_INFO_IN_TASK|SECURITY_SELINUX|SECCOMP|OVERLAY_FS|EXT4_FS|MODVERSIONS|MODULE_SIG_FORCE|DEBUG_INFO|WLAN|CFG80211|ICNSS|CNSS_GENL|CRYPTO_SHA256)=' "$OUT/.config" || true
          grep -q '^CONFIG_KSU=y'                        "$OUT/.config" || { echo "::error::CONFIG_KSU 未生效，Nova 集成失败"; exit 1; }
          grep -q '^CONFIG_KSU_SUSFS=y'                  "$OUT/.config" || { echo "::error::CONFIG_KSU_SUSFS 未生效"; exit 1; }
          grep -q '^CONFIG_KSU_SUSFS_INLINE_HOOK=y'      "$OUT/.config" || { echo "::error::CONFIG_KSU_SUSFS_INLINE_HOOK 未生效"; exit 1; }
          grep -q '^CONFIG_KSU_SUSFS_PRIORITY_UID_FILTER=y' "$OUT/.config" || { echo "::error::CONFIG_KSU_SUSFS_PRIORITY_UID_FILTER 未生效"; exit 1; }
          grep -q '^CONFIG_KPM=y'                        "$OUT/.config" || { echo "::error::CONFIG_KPM 未生效"; exit 1; }
          grep -q '^CONFIG_KALLSYMS_ALL=y'               "$OUT/.config" || { echo "::error::CONFIG_KALLSYMS_ALL 未生效"; exit 1; }
          grep -q '^CONFIG_THREAD_INFO_IN_TASK=y'        "$OUT/.config" || { echo "::error::CONFIG_THREAD_INFO_IN_TASK 未生效，SUSFS 依赖它"; exit 1; }
          grep -q '^CONFIG_SECURITY_SELINUX=y'           "$OUT/.config" || { echo "::error::CONFIG_SECURITY_SELINUX 未生效，KSU 依赖它"; exit 1; }
          grep -q '^CONFIG_OVERLAY_FS=y'                 "$OUT/.config" || { echo "::error::CONFIG_OVERLAY_FS 未生效，KSU 依赖它"; exit 1; }
          grep -q '^CONFIG_EXT4_FS=y'                    "$OUT/.config" || { echo "::error::CONFIG_EXT4_FS 未生效"; exit 1; }
          # WiFi 依赖的原厂配置不得被改动
          grep -q '^CONFIG_WLAN=y'             "$OUT/.config" || { echo "::error::CONFIG_WLAN 被改动，vendor wlan.ko 无法加载"; exit 1; }
          grep -q '^CONFIG_CFG80211=y'         "$OUT/.config" || { echo "::error::CONFIG_CFG80211 被改动，vendor wlan.ko 无法加载"; exit 1; }
          grep -q '^CONFIG_ICNSS=y'            "$OUT/.config" || { echo "::error::CONFIG_ICNSS 被改动，vendor wlan.ko 无法加载"; exit 1; }
          grep -q '^CONFIG_CNSS_GENL=y'        "$OUT/.config" || { echo "::error::CONFIG_CNSS_GENL 被改动"; exit 1; }
          grep -q '^CONFIG_MODVERSIONS=y'      "$OUT/.config" || { echo "::error::CONFIG_MODVERSIONS 被改动，vermagic 会与 vendor 模块不匹配"; exit 1; }

      - name: Build Image.gz
        run: |
          set -o pipefail
          export PATH="$CLANG_DIR/bin:$GCC64_DIR/bin:$GCC32_DIR/bin:$PATH"
          # -k：一次编译尽量跑完，把所有报错一次性暴露出来（便于一轮修完）
          make -C "$KSRC" O="$OUT" ARCH=arm64 \
            CC=clang CLANG_TRIPLE=aarch64-linux-gnu- REAL_CC="$CLANG_DIR/bin/clang" \
            CROSS_COMPILE=aarch64-linux-android- CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            -k -j"$(nproc)" Image.gz 2>&1 | tee /tmp/build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ] || [ ! -f "$OUT/arch/arm64/boot/Image.gz" ]; then
            echo "::error::编译失败（exit=$status），下面汇总错误行："
            grep -nE 'error:|Error [0-9]+|undefined reference|No rule to make' /tmp/build.log | head -n 300 || true
            exit 1
          fi
          echo "--- artifacts ---"
          ls -l "$OUT/arch/arm64/boot/Image.gz" "$OUT/vmlinux" "$OUT/System.map"
          echo "--- kernel release ---"
          strings "$OUT/vmlinux" | grep -m1 'Linux version' || true
          echo "--- vermagic (必须与原厂一致: 4.19.152-perf+ SMP preempt mod_unload modversions aarch64) ---"
          strings "$OUT/vmlinux" | grep -m1 '^4\.19\.152-perf+' || true
          echo "--- SukiSU-Nova / SUSFS 编译摘要 ---"
          grep -E '^(-- .*(version|Manager|KERNEL_|KPM|using|SUSFS_VERSION))|KernelSU/compat|drivers/kernelsu' /tmp/build.log | head -n 60 || true
          echo "--- 关键符号确认 ---"
          grep -E 'susfs_set_sus_path_uid_filter|susfs_add_sus_type|ksu_handle_execveat|ksu_handle_sys_read' "$OUT/System.map" | head -n 20 || true

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sukisu-nova-builtinnew-susfs240-kpm-${{ env.KSU_REF }}
          path: |
            out/arch/arm64/boot/Image.gz
            out/vmlinux
            out/System.map
            out/.config
            out/config_diff.txt
          if-no-files-found: error
